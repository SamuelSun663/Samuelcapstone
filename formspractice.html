<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clubform</title>
</head>
<body>
    <h2>Sample form</h2>
    <form 
        <label for="useremail"></label>
        <input type="email" id="useremail" name="useremail" placeholder="max.pollack@ousd.org">
        <label for="userpass"> Password:</label>
        <input type="password" id="userpass" name="userpass" placeholder="password">
        <input type="submit" value="SUBMIT">
        <br>
        <label for="usermood"> Mood:</label>
        <select id="usermood" name="usermood">
            <option value="happy">Happy</option>
            <option value="sad">Sad</option>
            <option value="angry">Angry</option>
            <option value="excited">Excited</option> 
        </select>
        <br>
        <label for="useressay">  Essay:</label>
        <textarea id="useressay" name="useressay" rows="6" cols="50" placeholder="Write your essay here..."></textarea>


        <h3>Do you already own a dog?</h3>
<label for="yes">Yes</label>
<input type="radio" id="yes" name="dog_choice" value="yes">


<label for="no">No:</label>
<input type="radio" id="no" name= "dog_choice" value="no">
 
    ></form>
</body>
</html>
