<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies!</title>
</head>
<body>
    
    <h1> Puppy Adoption Page</h1>
    <h2> Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p> Please Note: First Name, Last Name, Password, and Email are required. </p>
    <form>
    <label for="name"> First Name: </label>
    <input type="text" id="name" name="name" placeholder="First Name" required>
    <label for="lastname"> Last Name: </label>
    <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
    <br>
    <label for="email"> Email: </label>
    <input type="email" id="email" name="email" placeholder="name@email.com" required>
    <label for="password"> Password: </label>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <br>
    <p> Are you over the age of 18?</p>
    <label for="yes"> Yes: </label>
    <input type="radio" id="yes" name="age" value="yes">
    <label for="no"> No: </label>
    <input type="radio" id="no" name="age" value="no">
    <br>
    <p> Do you have a Credit Card or Paypal?</p>
    <select name="card" id="card">
        <option value="credit">Credit Card</option>
        <option value="paypal">PayPal</option>
    </select>
    <br>
    <br>
    <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
